<!DOCTYPE html>
<html>
<head>
<title>SVG Example</title>
</head>
<body>

<h2>Simple SVG Shapes</h2>

<svg width="300" height="200">

  <!-- Circle -->
  <circle cx="80" cy="80" r="50" stroke="black" stroke-width="3" fill="red" />

  <!-- Rectangle -->
  <rect x="150" y="30" width="120" height="80"
  stroke="blue" stroke-width="3" fill="yellow" />

</svg>

</body>
</html>
